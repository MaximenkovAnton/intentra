name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA Signed
    runs-on: ubuntu-latest
    steps:
      - name: Check the contributor's CLA signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/MaximenkovAnton/intentra/blob/main/CLA.md
          branch: cla-signatures
          allowlist: 'MaximenkovAnton,*[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please
            read the CLA at
            https://github.com/MaximenkovAnton/intentra/blob/main/CLA.md and
            sign it by commenting the sentence below.
