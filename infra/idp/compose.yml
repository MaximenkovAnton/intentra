# Pocket ID (OIDC identity provider) stack.
#
# Copy .env.example to .env in this directory and fill it in before running
# `docker compose up -d`.
#
# The SQLite database and uploads live in the pocket-id-data volume. The TLS
# certificate and key are mounted from ./certs: browsers only allow passkeys on
# HTTPS origins (or localhost).

name: intentra-idp

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.19.3
    restart: unless-stopped
    env_file: .env
    ports:
      - "${IDP_PORT:-1411}:1411"
    volumes:
      - pocket-id-data:/app/data
      - ./certs:/certs:ro
    mem_limit: 512m
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pocket-id-data:
