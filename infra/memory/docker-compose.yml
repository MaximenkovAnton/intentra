name: intentra-memory

services:
  falkordb:
    image: falkordb/falkordb:6.2.1
    restart: unless-stopped
    ports:
      - '${FALKORDB_PORT:-16379}:6379'
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    mem_limit: 768m
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -p 6379 ping >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - '${QDRANT_PORT:-16333}:6333'
      - '${QDRANT_GRPC_PORT:-16334}:6334'
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/6333" 2>/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ollama:
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    mem_limit: 4g
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ollama/ollama:0.12.3
    restart: 'no'
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c', 'ollama pull ${OLLAMA_MODEL:-bge-m3}']

volumes:
  falkordb-data:
  qdrant-data:
  ollama-data:
